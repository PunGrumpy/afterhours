name: Bug report
description: Something in Afterhours doesn't work the way the README says it should
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue, please [search](https://github.com/PunGrumpy/afterhours/issues) existing ones and :+1: upvote instead of filing a duplicate. That gets it fixed sooner.

  - type: checkboxes
    attributes:
      label: Verify latest release
      description: Please try the [latest release](https://github.com/PunGrumpy/afterhours/releases/latest) first. The bug may already be fixed.
      options:
        - label: I verified that the issue exists in the latest Afterhours release.
          required: true

  - type: input
    attributes:
      label: Afterhours version
      description: Shown on the release you installed, or `git rev-parse --short HEAD` if you built it yourself.
    validations:
      required: true

  - type: input
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro 14-inch M4"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Power state when it happened
      multiple: true
      options:
        - Plugged in
        - On battery
        - Lid closed
        - Lid-closed mode installed (sudoers rule)
        - Low Power Mode on
    validations:
      required: true

  - type: input
    attributes:
      label: Agents involved
      description: Which coding agents were running, and whether Claude Code hooks were installed.
      placeholder: "Claude Code with hooks, Codex"

  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: To Reproduce
      description: Steps that reproduce the problem. Screenshots of the menu or Settings help.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      render: shell
      description: |
        Paste the output of these two commands, run right after the problem. Check them for anything you don't want to share.

        ```sh
        log show --last 10m --predicate 'process == "Afterhours"' --style compact
        pmset -g assertions
        ```
