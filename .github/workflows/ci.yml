name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.affected.outputs.macos }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Find affected apps
        id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          names="$(bunx turbo ls --affected --output=json 2>/dev/null | jq -r '.packages.items[].name')"
          for app in macos web; do
            if grep -qx "@afterhours/$app" <<<"$names"; then echo "$app=true"; else echo "$app=false"; fi >> "$GITHUB_OUTPUT"
          done

  web:
    needs: check
    if: needs.check.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@afterhours/web

  macos:
    needs: check
    if: needs.check.outputs.macos == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@afterhours/macos
