name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: bun run version

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  app:
    needs: publish
    # Run it by hand to rebuild the app for the current version's tag.
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(needs.publish.outputs.published-packages, '"@afterhours/macos"'))
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: swift test --package-path packages/core
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
        run: |
          if [[ -z "$DEVELOPER_ID_P12$DEVELOPER_ID_P12_PASSWORD$NOTARY_KEY$NOTARY_KEY_ID$NOTARY_ISSUER_ID" ]]; then
            if [[ "$REQUIRE_SIGNING" == true ]]; then
              echo "::error::REQUIRE_SIGNING is set, but the Developer ID secrets are missing."
              exit 1
            fi
            echo "::warning::No Developer ID secrets, so the app is signed ad-hoc and isn't notarized."
            exit 0
          fi
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Set the $name secret too, or remove all signing secrets."; exit 1; fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<<"$DEVELOPER_ID_P12" > "$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a prompt that would hang the runner.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application identity."; exit 1; fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
      - run: ./apps/macos/scripts/build-app.sh
      - name: Publish the app and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          version="$(jq -r .version apps/macos/package.json)"
          tag="@afterhours/macos@$version"
          ./apps/macos/scripts/package-app.sh
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' \
            apps/macos/CHANGELOG.md > notes.md
          { echo; cat .github/release-install.md; } >> notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Afterhours $version" --notes-file notes.md
          else
            # Changesets skips the release when the package has no CHANGELOG.md yet.
            gh release create "$tag" --verify-tag --title "Afterhours $version" --notes-file notes.md
          fi
          gh release upload "$tag" apps/macos/dist/* --clobber
      - name: Deploy the website
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
