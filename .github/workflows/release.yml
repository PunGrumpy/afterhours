name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: changesets/action/version@v2

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published-packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: publish
        uses: changesets/action/publish@v2

  app:
    needs: publish
    # Run it by hand to rebuild the app for the current version's tag.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || contains(needs.publish.outputs.published-packages, '"@afterhours/macos"'))
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@afterhours/macos
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/macos/package.json)"
          tag="@afterhours/macos@$version"
          zip="Afterhours-$version.zip"
          ditto -c -k --keepParent apps/macos/build/Afterhours.app "$zip"
          # Changesets skips the release when the package has no CHANGELOG.md yet.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
          gh release upload "$tag" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
