name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "bun.lock"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "::warning::VERCEL_DEPLOY_HOOK isn't set, so the website wasn't deployed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
